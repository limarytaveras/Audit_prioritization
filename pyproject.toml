[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audit-prioritization-portfolio"
version = "3.0.0"
description = "Explainable risk-based audit prioritization with synthetic data"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "scikit-learn>=1.4,<2"]

[tool.setuptools.packages.find]
where = ["src"]
